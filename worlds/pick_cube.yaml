name: pick_cube                # Franka Panda + 2FG7 桌面抓取：夹起方块抬进空中成功区
timestep: 0.002
ctrl_period: 32
gravity: [0, 0, -9.81]
integrator: implicitfast       # panda 高刚度位置伺服（kp=4500）依赖隐式积分
impratio: 10

scene:
  floor:
    size: [2.0, 2.0]
    texture: grid
    friction: 1.0
  lights:
    - {pos: [0, 0, 3]}
  objects:
    # 工作台（顶面 z=0.68）：panda 立于桌后缘 (0,0,0.68)
    - name: table
      type: box
      size: [0.35, 0.25, 0.03]
      pos: [0.325, 0, 0.65]
      color: "#6B7280"
      static: true
    # 60mm 方块（0.1kg/摩擦1.0：满握每指压力 ~1.35N，抗 0.98N 重力余量 2.7 倍）
    - name: cube
      type: box
      size: [0.03, 0.03, 0.03]
      pos: [0.55, 0, 0.71]
      mass: 0.1
      friction: 1.0
      color: "#F59E0B"

robots:
  - name: arm
    model: zoo://franka_emika_panda
    pos: [0, 0, 0.68]
    gripper: {model: onrobot_2fg7}
    controller: ../controllers/pick_place.py

task:
  success:                              # 抬升 hold 到 (0.55, 0, 0.86) 空中成功区
    body: cube
    zone: {min: [0.49, -0.06, 0.80], max: [0.61, 0.06, 0.92]}
  reward:
    - distance: {a: cube, b: arm/link7, weight: -0.01}
    - zone: {body: cube, zone: {min: [0.49, -0.06, 0.80], max: [0.61, 0.06, 0.92]}, weight: 0.01}
  max_ticks: 5000

runtime:
  realtime: false
  controller_timeout: 100
  timeout_policy: last_ctrl
