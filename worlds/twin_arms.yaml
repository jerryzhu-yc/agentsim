name: twin_arms                # M0.3 双机器人演示：两台机械臂各自随机漫步
timestep: 0.002
ctrl_period: 32
gravity: [0, 0, -9.81]

scene:
  floor: {size: [2.0, 2.0], texture: grid}
  lights:
    - {pos: [0, 0, 3]}
  objects:
    - name: cube_a
      type: box
      size: [0.05, 0.05, 0.05]
      pos: [0.25, 0.15, 0.051]
      mass: 0.1
      color: "#F59E0B"
    - name: cube_b
      type: box
      size: [0.05, 0.05, 0.05]
      pos: [0.85, 0.15, 0.051]
      mass: 0.1
      color: "#3B82F6"

robots:
  - name: arm_a
    model: ../models/demo_arm.xml
    pos: [0, 0, 0]
    controller: ../controllers/random_arm.py
    args: {speed: 0.15}
  - name: arm_b
    model: ../models/demo_arm.xml
    pos: [0.6, 0, 0]
    controller: ../controllers/random_arm.py
    args: {speed: 0.3}

task:
  reward:
    - distance: {a: cube_a, b: arm_a/wrist, weight: -1.0}
    - distance: {a: cube_b, b: arm_b/wrist, weight: -1.0}
  max_ticks: 3000

runtime:
  realtime: false
  controller_timeout: 100
  timeout_policy: last_ctrl
